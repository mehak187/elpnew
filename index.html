<!doctype html>
<!-- en-GB, not en-US: it is what makes the browser's own date fields read and
     accept dates as DD/MM/YYYY, which is how they are written here. -->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      IBM Plex Sans Arabic carries the whole interface: 400 for values and
      table data, 500 for labels and buttons, 600 for titles and active
      elements, 700 only where something must shout.

      Served from the CDN for now. Standard 02 asks for the files to be
      hosted locally before go-live, so that a slow or blocked connection
      cannot drop the whole system back to a browser default.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>yands</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
